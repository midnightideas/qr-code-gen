<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
          integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU"
          crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 480px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #555;
      font-weight: 500;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      background: #fafafa;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      padding: 1rem;
    }

    .qr-container canvas,
    .qr-container img {
      max-width: 100%;
      height: auto;
    }

    .placeholder {
      color: #999;
      text-align: center;
      padding: 2rem;
    }

    .placeholder svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.3;
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
    }

    button {
      flex: 1;
      padding: 0.875rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-copy {
      background: #333;
      color: white;
    }

    .btn-copy:hover:not(:disabled) {
      background: #444;
    }

    .btn-download {
      background: #667eea;
      color: white;
    }

    .btn-download:hover:not(:disabled) {
      background: #5a6fd6;
    }

    button svg {
      width: 18px;
      height: 18px;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 1000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .container {
        padding: 1.5rem;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>QR Code Generator</h1>

    <div class="input-group">
      <label for="url-input">Enter URL or Text</label>
      <input
        type="url"
        id="url-input"
        placeholder="https://example.com"
        autocomplete="url"
      >
    </div>

    <div class="qr-container" id="qr-container">
      <div class="placeholder">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h2M4 12h2m10 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
        </svg>
        <p>Enter a URL to generate QR code</p>
      </div>
    </div>

    <div class="buttons">
      <button class="btn-copy" id="copy-btn" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        Copy
      </button>
      <button class="btn-download" id="download-btn" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Download PNG
      </button>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const urlInput = document.getElementById('url-input');
    const qrContainer = document.getElementById('qr-container');
    const copyBtn = document.getElementById('copy-btn');
    const downloadBtn = document.getElementById('download-btn');
    const toast = document.getElementById('toast');

    let qrCode = null;
    let currentData = '';
    let qrCanvas = null;

    function generateQR(data) {
      qrContainer.innerHTML = '';

      qrCode = new QRCode(qrContainer, {
        text: data,
        width: 200,
        height: 200,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      // Wait for canvas to be created
      setTimeout(() => {
        qrCanvas = qrContainer.querySelector('canvas');
        if (qrCanvas) {
          copyBtn.disabled = false;
          downloadBtn.disabled = false;
        }
      }, 100);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    urlInput.addEventListener('input', (e) => {
      const value = e.target.value.trim();

      if (!value) {
        qrContainer.innerHTML = `
          <div class="placeholder">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h2M4 12h2m10 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
            </svg>
            <p>Enter a URL to generate QR code</p>
          </div>
        `;
        copyBtn.disabled = true;
        downloadBtn.disabled = true;
        currentData = '';
        qrCanvas = null;
        return;
      }

      currentData = value;
      generateQR(value);
    });

    copyBtn.addEventListener('click', async () => {
      if (!qrCanvas) return;

      try {
        const blob = await new Promise(resolve => qrCanvas.toBlob(resolve, 'image/png'));
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': blob })
        ]);
        showToast('Copied to clipboard!');
      } catch (err) {
        // Fallback for browsers that don't support clipboard API with images
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = qrCanvas.width;
        tempCanvas.height = qrCanvas.height;
        const ctx = tempCanvas.getContext('2d');
        ctx.drawImage(qrCanvas, 0, 0);

        tempCanvas.toBlob(async (blob) => {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blob })
            ]);
            showToast('Copied to clipboard!');
          } catch (e) {
            showToast('Failed to copy. Try downloading instead.');
          }
        }, 'image/png');
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!qrCanvas) return;

      const link = document.createElement('a');
      link.download = 'qrcode.png';
      link.href = qrCanvas.toDataURL('image/png');
      link.click();
      showToast('Downloaded as qrcode.png');
    });

    // Handle Enter key
    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        urlInput.blur();
      }
    });
  </script>
</body>
</html>
